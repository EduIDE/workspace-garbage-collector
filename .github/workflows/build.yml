name: Build and Push Docker Image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Called by release.yml, which passes the release version as image_tag.
  workflow_call:
    inputs:
      image_tag:
        description: "Image tag, e.g. 0.3.0"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: EduIDE/.github/.github/workflows/build-and-push-docker-image.yml@v1
    with:
      docker-file: Dockerfile
      # The chart in helm/values.yaml pulls ghcr.io/eduide/garbage-collector.
      image-name: eduide/garbage-collector
      docker-context: .
      # Empty on push and pull request, where the shared workflow derives the
      # tag. From release.yml the event is workflow_dispatch on main, which
      # would derive "latest", so the release passes the version explicitly.
      image-tag: ${{ inputs.image_tag }}
      # Small Go build; reclaiming disk space is not worth the time.
      free-disk-space: false
    secrets: inherit
