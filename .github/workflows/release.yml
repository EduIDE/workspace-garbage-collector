# Manual release. The only way this repository releases.
#
#   gh workflow run release.yml -R EduIDE/workspace-garbage-collector -f version=0.3.0
#
# Publishes the image ghcr.io/eduide/garbage-collector:X.Y.Z and the chart
# oci://ghcr.io/eduide/charts/theia-workspace-garbage-collector:X.Y.Z. The chart
# defaults image.tag to its appVersion, so it pins its own image.
# See .claude/skills/release/SKILL.md for the whole flow.
#
# A Release created with GITHUB_TOKEN starts no other workflow, so the image
# build is called from here.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.3.0, or 0.3.0-rc.1 for a prerelease"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: EduIDE/.github/.github/workflows/release.yml@main
    with:
      version: ${{ inputs.version }}
      tag_prefix: "theia-workspace-garbage-collector-"
      version_check: |
        for key in version appVersion; do
          got=$(yq -r ".${key}" helm/Chart.yaml)
          if [[ "$got" != "$VERSION" ]]; then
            echo "::error file=helm/Chart.yaml::${key} is '$got', expected '$VERSION'. Bump it in the release pull request first."
            exit 1
          fi
        done

  images:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      image_tag: ${{ inputs.version }}
    secrets: inherit

  publish:
    needs: [release, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # helm push overwrites, so refuse a version that is already published.
      - name: Package and push the chart
        run: |
          set -euo pipefail
          ref=oci://ghcr.io/eduide/charts
          if out=$(helm show chart "$ref/theia-workspace-garbage-collector" --version "$VERSION" 2>&1); then
            echo "::error::Chart ${VERSION} is already published. Pick the next version."
            exit 1
          fi
          # Only "not found" proves the version is free; any other error could hide a published chart.
          if ! grep -qi 'not found' <<<"$out"; then
            echo "::error::could not check chart ${VERSION}: ${out}"
            exit 1
          fi
          # --version/--app-version stamp a release candidate; for a stable
          # release they equal what Chart.yaml already says.
          helm package helm --version "$VERSION" --app-version "$VERSION"
          helm push "theia-workspace-garbage-collector-${VERSION}.tgz" "$ref"

  verify:
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: azure/setup-helm@v4

      - name: Image and chart exist
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          arches=$(docker buildx imagetools inspect --raw "ghcr.io/eduide/garbage-collector:${VERSION}" | jq -r '[.manifests[].platform.architecture] | sort | join(",")')
          [[ "$arches" == *amd64* && "$arches" == *arm64* ]] || { echo "::error::image has ${arches:-no platforms}, expected amd64 and arm64"; exit 1; }
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm show chart "oci://ghcr.io/eduide/charts/theia-workspace-garbage-collector" --version "$VERSION" | grep -x "version: ${VERSION}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
          {
            echo "## Released ${TAG}"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Last: publishing the draft creates the tag. Until here a failed job leaves
  # a draft and no tag.
  publish-release:
    needs: [release, verify]
    permissions:
      contents: write
    uses: EduIDE/.github/.github/workflows/release-publish.yml@main
    with:
      tag: ${{ needs.release.outputs.tag }}
