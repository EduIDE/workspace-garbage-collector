name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # Only meaningful on a pull request - the action diffs the PR's dependencies
  # against the base branch, so there is nothing for it to look at on a push.
  dependency-review:
    if: github.event_name == 'pull_request'
    uses: EduIDE/.github/.github/workflows/dependency-review.yml@v1
