name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  # Only meaningful on a pull request - the action diffs the PR's dependencies
  # against the base branch, so there is nothing for it to look at on a push.
  dependency-review:
    if: github.event_name == 'pull_request'
    uses: EduIDE/.github/.github/workflows/dependency-review.yml@v1
