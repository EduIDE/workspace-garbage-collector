replicaCount: 1
image:
  repository: ghcr.io/eduide/garbage-collector
  # Empty means the chart appVersion, i.e. the image of the same release.
  tag: ""
  pullPolicy: Always

serviceAccount:
  name: garbage-collector-sa

env:
  WORKSPACE_TTL: "1209600s"
  CHECK_INTERVAL: "1800s"

global:
  # Pin the pod to a node pool, e.g. {aet.cit.tum.de/pool: pve}. Set by the parent eduide chart.
  nodeSelector: {}
